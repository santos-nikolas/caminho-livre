# Stack do Caminho Livre. O MESMO arquivo roda local e na VM (Terraform copia via cloud-init).
# Local: docker-compose.override.yml adiciona o build. Producao: imagem do GHCR.
name: caminho-livre

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caminholivre
      POSTGRES_USER: caminholivre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caminholivre -d caminholivre"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    # sem "ports": o banco so e acessivel pela rede interna do compose

  api:
    image: ${API_IMAGE:?defina API_IMAGE no .env}
    environment:
      DATABASE_URL: postgresql://caminholivre:${POSTGRES_PASSWORD}@db:5432/caminholivre
      ADMIN_TOKEN: ${ADMIN_TOKEN:?defina ADMIN_TOKEN no .env}
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN no .env}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    restart: unless-stopped

  proxy:
    # SITE_ADDRESS = dominio publico -> Caddy emite certificado HTTPS (Let's Encrypt) sozinho
    image: caddy:2-alpine
    command: caddy reverse-proxy --from ${SITE_ADDRESS:-:80} --to api:8000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
