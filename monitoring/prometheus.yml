# Prometheus local raspando o MVP PUBLICADO (permitido pelo enunciado).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alertas.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: caminho-livre
    scheme: https
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics_token # token fora do repositorio
    static_configs:
      - targets: ["caminholivre-gs.brazilsouth.cloudapp.azure.com"] # = output app_url do Terraform
        labels:
          ambiente: producao
