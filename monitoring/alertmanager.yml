# Envia os alertas para um canal do Discord. A URL do webhook fica em secrets/ (fora do git).
route:
  receiver: discord
  group_by: [alertname]
  group_wait: 10s
  repeat_interval: 1h
receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook
        send_resolved: true
